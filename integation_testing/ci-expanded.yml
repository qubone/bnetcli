name: CI Expanded

on:
  push:
    branches: [main]
  pull_request:
    #branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [3.10, 3.11, 3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff mypy
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src/bnetcli
      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-fail-under=80

  packaging:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build package
        run: python -m build
      - name: Install wheel and smoke test CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          bnetcli --help
      - name: Pipx install check
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          python -m pipx install --force dist/*.whl
          bnetcli --help

  testpypi: 
    runs-on: ubuntu-latest
    needs: packaging
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Check environment for testpypi
        run: |
          echo "TestPyPI publishing requires secrets and is not executed in CI by default."
